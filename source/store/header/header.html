<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Lilita One';src:url('/web/fonts/lilita-one-latin.woff2') format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:823px;overflow:hidden;background:#06140b}
.bg{position:absolute;inset:-40px;background:url('/source/art/chapters/ch2_enterjungle.png') center 40%/cover;filter:blur(7px) saturate(1.15) brightness(.62)}
.bg2{position:absolute;inset:0;background:radial-gradient(ellipse 70% 90% at 68% 50%,rgba(255,216,77,.20),transparent 60%),linear-gradient(90deg,rgba(4,16,8,.88) 0%,rgba(4,16,8,.55) 38%,rgba(4,16,8,.05) 70%),linear-gradient(0deg,rgba(4,16,8,.7),transparent 35%)}
.title{position:absolute;left:150px;top:205px;width:760px}
.title img{width:100%;display:block;filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.by{margin-top:24px;font:600 30px -apple-system,'SF Pro Text',system-ui,sans-serif;letter-spacing:.3em;color:#f1e7c6;text-shadow:0 2px 8px rgba(0,0,0,.85)}
.tag{margin-top:30px;line-height:1.18;font:700 48px -apple-system,'SF Pro Display',system-ui,sans-serif;letter-spacing:.005em;color:#ffd84d;text-shadow:0 2px 4px rgba(0,0,0,.9),0 4px 18px rgba(0,0,0,.7)}
.fan{position:absolute;left:1015px;top:120px;width:820px;height:640px}
.card{position:absolute;width:300px;height:450px;border-radius:24px;border:7px solid #ffd84d;background-size:cover;background-position:center;box-shadow:0 26px 50px rgba(0,0,0,.65),0 0 0 2px rgba(0,0,0,.4) inset}
</style></head><body>
<div class="bg"></div><div class="bg2"></div>
<div class="title"><img src="/source/art/brand/wordmark.png"><div class="by">A GAME BY POLYMER JONES</div><div class="tag">Match the monkeys.<br>Clear the jungle.</div></div>
<div class="fan">
 <div class="card" style="left:0;top:110px;transform:rotate(-16deg);background-image:url('/source/art/expedition/white_faced_capuchin.png')"></div>
 <div class="card" style="left:125px;top:45px;transform:rotate(-8deg);background-image:url('/source/art/expedition/golden_snub_nosed_monkey.png')"></div>
 <div class="card" style="left:500px;top:110px;transform:rotate(16deg);background-image:url('/source/art/expedition/ring_tailed_lemur.png')"></div>
 <div class="card" style="left:375px;top:45px;transform:rotate(8deg);background-image:url('/source/art/expedition/black_howler_monkey.png')"></div>
 <div class="card" style="left:250px;top:15px;transform:rotate(0);background-image:url('/source/art/expedition/mandrill.png');z-index:2"></div>
</div>
</body></html>
