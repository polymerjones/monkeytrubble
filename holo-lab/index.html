<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holo Lab</title>
<style>
  :root{--bg:#0b1a10;--panel:#122a19;--line:#24502f;--text:#eaf6ea;--dim:#9dbca4;--gold:#ffd84d;--accent:#7dff9a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,sans-serif;height:100vh;display:grid;grid-template-columns:300px 1fr 330px;overflow:hidden}
  h1{font-size:15px;letter-spacing:.12em;margin:0 0 10px;color:var(--gold)}
  h2{font-size:12px;letter-spacing:.14em;color:var(--dim);margin:18px 0 8px;font-weight:700}
  .side{background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
  .side.right{border-right:0;border-left:1px solid var(--line)}
  input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1a10;color:var(--text)}
  .filters{display:flex;gap:6px;margin:8px 0}
  .filters button{flex:1}
  button{font:inherit;color:var(--text);background:#1b3a24;border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
  .list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .item{position:relative;padding:0;border-radius:8px;overflow:hidden;aspect-ratio:2/3;background:#000}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item.sel{outline:3px solid var(--gold);outline-offset:-3px}
  .item .tag{position:absolute;left:3px;top:3px;font-size:10px;padding:1px 5px;border-radius:6px;background:#000a;color:var(--gold)}
  .item .tag.changed{color:#ff9be8}
  .stage{display:grid;place-items:center;perspective:900px;position:relative;background:radial-gradient(circle at 50% 40%,#1d4a2a,#06120a 70%)}
  .card{position:relative;width:min(56vh,400px);aspect-ratio:2/3;border-radius:18px;padding:7px;background:linear-gradient(135deg,#fff6c9,#e0a92a 35%,#fff8d8 60%,#b8801a);box-shadow:0 30px 60px #000c;transform-style:preserve-3d;will-change:transform}
  .face{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;background:#000}
  .face img{width:100%;height:100%;object-fit:cover;display:block}
  .face canvas{position:absolute;inset:0;width:100%;height:100%}
  .caption{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--dim);font-size:12px}
  .caption b{color:var(--text);font-size:16px;display:block}
  .ab{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .row{display:grid;grid-template-columns:80px 1fr 44px;gap:8px;align-items:center;margin:8px 0}
  .row span{color:var(--dim);font-size:12px}
  .row output{text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .toggle{display:flex;gap:8px;align-items:center;margin:4px 0 10px}
  textarea{width:100%;height:150px;background:#06120a;color:#bfe9c8;border:1px solid var(--line);border-radius:8px;font:11px/1.35 ui-monospace,Menlo,monospace;padding:8px}
  .note{color:var(--dim);font-size:12px}
  .big{width:100%;padding:10px;font-weight:800;letter-spacing:.08em;background:var(--gold);color:#3b2600;border-color:var(--gold)}
  .err{color:#ff8a8a}
</style>
</head>
<body>
<aside class="side">
  <h1>HOLO LAB</h1>
  <p class="note" style="margin:-4px 0 10px"><a href="puzzles.html" style="color:var(--gold)">Puzzle names →</a> · <a href="puzzle-feel.html" style="color:var(--gold)">Puzzle feel →</a> · <a href="framing.html" style="color:var(--gold)">Card framing →</a></p>
  <input type="search" id="q" placeholder="Search cards…">
  <div class="filters"><button data-f="holo" class="on">Holo cards</button><button data-f="all">All cards</button><button data-f="changed">Changed</button></div>
  <div class="list" id="list"></div>
</aside>
<main class="stage" id="stage">
  <div class="ab"><button id="showGame">Game now</button><button id="showPick" class="on">Your pick</button><button id="sway" class="on">Auto sway</button></div>
  <div class="card" id="card"><div class="face"><img id="art" alt=""><canvas id="cv"></canvas></div></div>
  <div class="caption"><b id="name">…</b><span id="file"></span></div>
</main>
<aside class="side right">
  <h2>HOLO ON THIS CARD</h2>
  <div class="toggle"><button id="onBtn">ON</button><button id="offBtn">OFF</button></div>
  <h2>PATTERN</h2>
  <div class="chips" id="presets"></div>
  <h2>FOIL COLOUR</h2>
  <div class="toggle"><input type="color" id="foil"><span class="note" id="foilHex"></span></div>
  <h2>STRENGTH</h2>
  <div id="sliders"></div>
  <button id="reset">Reset this card to the game's look</button>
  <h2>SEND TO CLAUDE</h2>
  <button class="big" id="copy">COPY PICKS</button>
  <p class="note" id="copied">Copies your changes. Paste them to Claude and they go into the game.</p>
  <textarea id="out" readonly></textarea>
  <p class="note">Move the mouse over the card to tilt it. Picks are saved in this browser.</p>
  <p class="err" id="err"></p>
</aside>
<script>
// Holo Lab: reads the holo shader, presets and HOLO_LOOKS straight out of web/index.html, so the preview is the game's own effect.
// Picks live in localStorage; COPY PICKS gives the changed entries as a HOLO_LOOKS snippet to paste into the game.
const GAME='../web/index.html',HERO='../web/cards/hero/',STORE='holoLab.picks';
const $=s=>document.querySelector(s);
const state={presets:[],defaults:{},game:{},picks:{},cards:[],sel:null,view:'pick',filter:'holo',q:'',sway:true,rx:0,ry:0,tx:0,ty:0};
try{state.picks=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state.picks))}catch{}renderOut();renderList()};
const SLIDERS=[['intensity','Intensity',0,1.2,.01],['glare','Glare',0,1,.01],['scale','Pattern size',.4,2.5,.05],['edge','Edge',0,1.5,.05]];

async function boot(){
  const src=await (await fetch(GAME)).text();
  const grab=(re,what)=>{const m=src.match(re);if(!m)throw new Error(`Couldn't find ${what} in web/index.html`);return m[1]};
  const vert=grab(/HOLO_VERT=`([\s\S]*?)`/,'HOLO_VERT'),frag=grab(/HOLO_FRAG=`([\s\S]*?)`/,'HOLO_FRAG');
  state.presets=new Function(`return ${grab(/const HOLO_PRESETS=(\[[^\]]*\])/,'HOLO_PRESETS')}`)();
  state.defaults=new Function(`return ${grab(/const HOLO_DEFAULTS=(\{[^}]*\})/,'HOLO_DEFAULTS')}`)();
  state.game=new Function(`return ${grab(/const HOLO_LOOKS=(\{[\s\S]*?\n    \})/,'HOLO_LOOKS')}`)();
  // Card names from the game's card tables (image then name); every hero file is listed, named or not.
  const names={};for(const m of src.matchAll(/image:'([^']+\.jpg)',name:(?:"([^"]+)"|'([^']+)')/g))names[m[1]]??=m[2]||m[3];
  const dir=await (await fetch(HERO)).text(),files=[...new Set([...dir.matchAll(/href="([^"]+\.jpg)"/g)].map(m=>decodeURIComponent(m[1])))].sort();
  state.cards=files.map(f=>({file:f,name:names[f]||f.replace(/\.jpg$/,'').replace(/-/g,' ')}));
  initGL(vert,frag);buildControls();
  const first=Object.keys(state.game)[0];select(state.cards.find(c=>c.file===first)||state.cards[0]);
  renderList();renderOut();requestAnimationFrame(frame);
}
// The look shown: the game's, or the game's with your changes (null = no holo).
const gameLook=f=>state.game[f]?{...state.defaults,...state.game[f]}:null;
const pickLook=f=>f in state.picks?(state.picks[f]?{...state.defaults,...state.game[f],...state.picks[f]}:null):gameLook(f);
const shownLook=()=>state.sel&&(state.view==='game'?gameLook(state.sel.file):pickLook(state.sel.file));

function renderList(){
  const list=$('#list'),q=state.q.toLowerCase();list.replaceChildren();
  for(const c of state.cards){
    const holo=!!pickLook(c.file),changed=c.file in state.picks;
    if(state.filter==='holo'&&!holo)continue;if(state.filter==='changed'&&!changed)continue;
    if(q&&!(`${c.name} ${c.file}`.toLowerCase().includes(q)))continue;
    const b=document.createElement('button');b.className=`item${state.sel===c?' sel':''}`;b.title=c.name;
    b.innerHTML=`<img loading="lazy" src="${HERO}${encodeURIComponent(c.file)}" alt="">${holo||changed?`<span class="tag${changed?' changed':''}">${changed?'changed':pickLook(c.file).preset}</span>`:''}`;
    b.onclick=()=>select(c);list.append(b)}
}
function select(c){state.sel=c;$('#name').textContent=c.name;$('#file').textContent=c.file;const img=$('#art');img.src=HERO+encodeURIComponent(c.file);img.onload=()=>uploadArt(img);syncControls();renderList()}
function edit(patch){const f=state.sel.file,cur=pickLook(f)||{...state.defaults,preset:'bursts',foil:'#ffe9a8'};state.picks[f]={...cur,...patch};
  // Back to exactly the game's look: not a change any more.
  const g=gameLook(f);if(g&&Object.keys(state.picks[f]).every(k=>state.picks[f][k]===g[k]))delete state.picks[f];
  state.view='pick';syncControls();save()}

function buildControls(){
  for(const p of state.presets){const b=document.createElement('button');b.textContent=p;b.dataset.p=p;b.onclick=()=>edit({preset:p});$('#presets').append(b)}
  for(const [k,label,min,max,step] of SLIDERS){const row=document.createElement('label');row.className='row';row.innerHTML=`<span>${label}</span><input type="range" min="${min}" max="${max}" step="${step}" data-k="${k}"><output></output>`;
    row.querySelector('input').oninput=e=>edit({[k]:+e.target.value});$('#sliders').append(row)}
  $('#foil').oninput=e=>edit({foil:e.target.value});
  $('#onBtn').onclick=()=>edit({});$('#offBtn').onclick=()=>{state.picks[state.sel.file]=null;if(!state.game[state.sel.file])delete state.picks[state.sel.file];syncControls();save()};
  $('#reset').onclick=()=>{delete state.picks[state.sel.file];syncControls();save()};
  $('#q').oninput=e=>{state.q=e.target.value;renderList()};
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));renderList()});
  $('#showGame').onclick=()=>{state.view='game';syncControls()};$('#showPick').onclick=()=>{state.view='pick';syncControls()};
  $('#sway').onclick=()=>{state.sway=!state.sway;$('#sway').classList.toggle('on',state.sway)};
  $('#copy').onclick=async()=>{renderOut();try{await navigator.clipboard.writeText($('#out').value);$('#copied').textContent='Copied! Paste it to Claude.'}catch{$('#out').select();$('#copied').textContent='Select-all and copy the box below.'}};
  const stage=$('#stage');stage.onpointermove=e=>{const r=$('#card').getBoundingClientRect();state.ty=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/2)))*22;state.tx=-Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/2)))*16};
  stage.onpointerleave=()=>{state.tx=state.ty=0};
}
function syncControls(){
  const look=pickLook(state.sel.file);$('#onBtn').classList.toggle('on',!!look);$('#offBtn').classList.toggle('on',!look);
  $('#showGame').classList.toggle('on',state.view==='game');$('#showPick').classList.toggle('on',state.view==='pick');
  const l=look||{...state.defaults,preset:'',foil:'#ffffff'};
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===l.preset));
  document.querySelectorAll('#sliders input').forEach(i=>{i.value=l[i.dataset.k];i.nextElementSibling.textContent=(+l[i.dataset.k]).toFixed(2)});
  $('#foil').value=l.foil;$('#foilHex').textContent=look?l.foil:'off';
}
function renderOut(){
  const lines=Object.entries(state.picks).map(([f,l])=>{if(!l)return`  '${f}':null,  // holo OFF`;const d=state.defaults,o={preset:l.preset,foil:l.foil};for(const k of Object.keys(d))if(l[k]!==d[k])o[k]=l[k];
    return`  '${f}':${JSON.stringify(o).replace(/"(\w+)":/g,'$1:').replace(/"/g,"'")},`});
  $('#out').value=lines.length?`// Holo Lab picks (${new Date().toLocaleString()}): HOLO_LOOKS entries\n${lines.join('\n')}`:'// No changes yet.'}

// WebGL: the same draw as the game's holoCardDraw.
let gl,prog,tex,u={},artReady=false,radius=12;
function initGL(vert,frag){const cv=$('#cv');gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:false});if(!gl){$('#err').textContent='This browser has no WebGL2.';return}
  const sh=(type,code)=>{const x=gl.createShader(type);gl.shaderSource(x,code);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x};
  prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vert));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,frag));gl.bindAttribLocation(prog,0,'position');gl.linkProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  for(const n of ['uArt','uSize','uAspect','uTilt','uLight','uDistance','uPreset','uIntensity','uScale','uEdge','uFrame','uRadius','uGlare','uFoil','uReady'])u[n]=gl.getUniformLocation(prog,n)}
function uploadArt(img){if(!gl)return;artReady=false;gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);artReady=true}
const foilRGB=hex=>[1,3,5].map(i=>Math.pow(parseInt(hex.slice(i,i+2),16)/255,2.2));
function frame(now){
  const t=now/1000,sx=state.sway&&!state.tx&&!state.ty?Math.sin(t*.9)*9:0,sy=state.sway&&!state.tx&&!state.ty?Math.sin(t*.6)*16:0;
  state.rx+=((state.tx||sx)-state.rx)*.12;state.ry+=((state.ty||sy)-state.ry)*.12;
  $('#card').style.transform=`rotateX(${state.rx.toFixed(2)}deg) rotateY(${state.ry.toFixed(2)}deg)`;
  const cv=$('#cv'),look=shownLook();
  if(gl&&prog){const dpr=Math.min(devicePixelRatio||1,2),w=Math.round(cv.clientWidth*dpr),h=Math.round(cv.clientHeight*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
    gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    if(look&&artReady){const R=Math.PI/180,rx=state.rx,ry=state.ry;gl.useProgram(prog);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.uniform1i(u.uArt,0);gl.uniform2f(u.uSize,w,h);gl.uniform1f(u.uAspect,h/w);gl.uniform2f(u.uTilt,rx*R,ry*R);
      gl.uniform2f(u.uLight,Math.max(0,Math.min(1,.5-Math.sin(ry*R)*1.6)),Math.max(0,Math.min(1,.38+Math.sin(rx*R)*1.6)));gl.uniform1f(u.uDistance,1100/Math.max(1,cv.clientWidth));
      gl.uniform1i(u.uPreset,state.presets.indexOf(look.preset));gl.uniform1f(u.uIntensity,look.intensity);gl.uniform1f(u.uScale,look.scale);gl.uniform1f(u.uEdge,look.edge);gl.uniform1f(u.uFrame,.04);
      gl.uniform1f(u.uRadius,radius/Math.max(1,cv.clientWidth));gl.uniform1f(u.uGlare,look.glare);gl.uniform3f(u.uFoil,...foilRGB(look.foil));gl.uniform1f(u.uReady,1);gl.drawArrays(gl.TRIANGLES,0,3)}}
  requestAnimationFrame(frame)}
boot().catch(e=>{$('#err').textContent=`${e.message}. Start the lab with holo-lab/Open Holo Lab.command.`});
</script>
</body>
</html>
